spring.datasource.url=jdbc:h2:mem:ms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS DEV
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
sentinel.ports.registry-json=classpath:test-ports.json
sentinel.db.registry-json=classpath:test-db.json
sentinel.pg.connections-log=classpath:empty.log
sentinel.pg.check-script=classpath:empty.ps1
sentinel.abandon.idle-minutes=90
sentinel.abandon.terminal-dirs[0]=target/test-terminals
sentinel.backup.roots[0]=target/test-releases
sentinel.backup.warn-after-days=7
sentinel.backup.crit-after-days=14
sentinel.backup.max-packs=10
sentinel.actions.auto-kill-enabled=false
sentinel.security.enabled=false
sentinel.security.client-id=machine-sentinel
sentinel.security.jwk-set-uri=http://127.0.0.1:9000/.well-known/jwks.json
sentinel.security.cors-origins[0]=http://127.0.0.1:3351
