spring.application.name=machine-sentinel
server.port=3350

# Tiny Hikari — shared Postgres multi-tenant (INC-04 pattern)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Compose MyAgent SoTs — never duplicate registries
sentinel.myagent.root=E:/MyAgent
sentinel.ports.registry-json=${sentinel.myagent.root}/workflow/ports/registry.json
sentinel.db.registry-json=${sentinel.myagent.root}/workflow/db/registry.json
sentinel.pg.connections-log=${sentinel.myagent.root}/workflow/db/logs/pg-connections.log
sentinel.pg.check-script=${sentinel.myagent.root}/workflow/db/scripts/check-pg-connections.ps1
sentinel.probe.timeout-ms=2500
sentinel.abandon.idle-minutes=90
sentinel.abandon.terminal-dirs[0]=${user.home}/.cursor/projects/E-MyWorkspace/terminals
sentinel.abandon.terminal-dirs[1]=${user.home}/.cursor/projects/E-MyAgent/terminals
sentinel.backup.roots[0]=H:/releases
sentinel.backup.warn-after-days=7
sentinel.backup.crit-after-days=14
sentinel.backup.max-packs=40
sentinel.actions.auto-kill-enabled=false
sentinel.schedule.pg-ms=300000
sentinel.schedule.probe-ms=600000
sentinel.schedule.backup-ms=1800000
sentinel.schedule.abandon-ms=900000

# CSS resource server (DEV IdP :9000)
sentinel.security.enabled=true
sentinel.security.client-id=machine-sentinel
sentinel.security.jwk-set-uri=http://127.0.0.1:9000/.well-known/jwks.json
sentinel.security.cors-origins[0]=http://127.0.0.1:3351
sentinel.security.cors-origins[1]=http://localhost:3351

logging.level.com.delena.machinesentinel=INFO
